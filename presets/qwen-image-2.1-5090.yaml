version: 1
name: qwen-image-2.1-5090

# Qwen-Image-2.1 for RTX 5090 (32GB): bf16 diffusion for full quality +
# int8 text encoder. Weights total ~24.3GB — fits 32GB with headroom for
# native 2K (4MP) generation. If you prefer the smaller download, swap the
# diffusion entry for qwen_image_2.1_int8_convrot.safetensors (7.3GB).
#
# Requires ComfyUI v0.37.0 or later — Qwen-Image-2.1 support landed in
# PR #16400 (merged 2026-09-19, commit 6bfaacc) and ships from v0.37.0.
# v0.36.0 and earlier do not include the nodes; build those with
# COMFYUI_VERSION=<sha>.
# 5090 (Blackwell, sm_120): use the cu130 image variant (see
# docs/rtx5090-migration.md).

models:
  - name: qwen-image-2.1-bf16
    type: diffusion_model
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: diffusion_models/qwen_image_2.1_bf16.safetensors

  - name: qwen3vl-8b-int8-convrot
    type: text_encoder
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: text_encoders/qwen3vl_8b_int8_convrot.safetensors

  - name: qwen-image-2.1-vae-bf16
    type: vae
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: vae/qwen_image_2.1_vae_bf16.safetensors
