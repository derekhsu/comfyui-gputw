version: 1
name: flux2-klein-f2k

# Goon's F2K I2I Edit + SeedVR2 workflow 所需的 Klein 9B 配套
# - moody-desire-v3_fp8 (8.46GB) 由 civitai CLI/手動下載（Civitai model version 3063794）
#   HF 鏡像可選：catlover1937/moody-desire-mix 的 moody-desire-v3.1_00001__fp8.safetensors (9.08GB)
# - workflow 另需 SeedVR2 模型：用 seedvr2-3b-q4km.yaml 補
models:
  - name: qwen_3_8b_fp8mixed
    type: text_encoder
    source:
      provider: huggingface
      repo_id: Comfy-Org/vae-text-encorder-for-flux-klein-9b
      filename: split_files/text_encoders/qwen_3_8b_fp8mixed.safetensors

  - name: flux2-vae
    type: vae
    source:
      provider: huggingface
      repo_id: Comfy-Org/vae-text-encorder-for-flux-klein-9b
      filename: split_files/vae/flux2-vae.safetensors

  - name: seedvr2-ema-3b-q4-k-m
    type: diffusion_model
    source:
      provider: huggingface
      repo_id: cmeka/SeedVR2-GGUF
      filename: seedvr2_ema_3b-Q4_K_M.gguf

  - name: seedvr2-ema-vae-fp16
    type: vae
    source:
      provider: huggingface
      repo_id: cmeka/SeedVR2-GGUF
      filename: ema_vae_fp16.safetensors
