version: 1
name: qwen-image-2.1-3090

# Qwen-Image-2.1 for RTX 3090 (24GB): int8 diffusion + int8 text encoder.
# Weights total ~17.4GB, leaving ~6GB for activations — enough for 1MP
# output; at native 2K (4MP) watch for OOM and consider swapping the text
# encoder to qwen3vl_8b_w4a8.safetensors (6.3GB, same repo) for headroom.
#
# Requires ComfyUI v0.37.0 or later — Qwen-Image-2.1 support landed in
# PR #16400 (merged 2026-09-19, commit 6bfaacc) and ships from v0.37.0.
# v0.36.0 and earlier do not include the nodes; build those with
# COMFYUI_VERSION=<sha>.
# 3090 (Ampere, sm_86): use the cu128 image variant; cu130 is only needed
# for Blackwell (sm_120) / NVFP4.

models:
  - name: qwen-image-2.1-int8-convrot
    type: diffusion_model
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: diffusion_models/qwen_image_2.1_int8_convrot.safetensors

  - name: qwen3vl-8b-int8-convrot
    type: text_encoder
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: text_encoders/qwen3vl_8b_int8_convrot.safetensors

  - name: qwen-image-2.1-vae-bf16
    type: vae
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: vae/qwen_image_2.1_vae_bf16.safetensors
