version: 1
name: qwen-image-2.1

# Qwen-Image-2.1 (released 2026-09-20): single model for text-to-image and
# instruction-based image editing, native 2K output, alpha-channel VAE.
#
# Requires ComfyUI built at commit 6bfaacc or later (PR #16400, merged
# 2026-09-19) — v0.36.0 does NOT include the nodes. Build with
# COMFYUI_VERSION=<sha> until the next release tag ships.
#
# Both diffusion variants are included: int8_convrot (~7.3GB, template
# default) and bf16 (~14.2GB, full quality). On a 32GB card (RTX 5090)
# bf16 diffusion + int8 text encoder fits; pick per workflow.
# Text encoder is int8_convrot (~9.4GB) — runs once per generation, so the
# bf16 variant (~17.5GB) is not worth the VRAM. VAE is bf16 only (~0.7GB).
#
# Official templates (bundled in comfyui-workflow-templates >= 0.11.66):
#   image_qwen_image_2_1_t2i.json        — text to image
#   image_qwen_image_2_1_image_edit.json — image edit (multi-image refs)

models:
  - name: qwen-image-2.1-int8-convrot
    type: diffusion_model
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: diffusion_models/qwen_image_2.1_int8_convrot.safetensors

  - name: qwen-image-2.1-bf16
    type: diffusion_model
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: diffusion_models/qwen_image_2.1_bf16.safetensors

  - name: qwen3vl-8b-int8-convrot
    type: text_encoder
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: text_encoders/qwen3vl_8b_int8_convrot.safetensors

  - name: qwen-image-2.1-vae-bf16
    type: vae
    source:
      provider: huggingface
      repo_id: Comfy-Org/Qwen-Image-2.1
      filename: vae/qwen_image_2.1_vae_bf16.safetensors
