name: build-vast

# Builds the vast.ai variant of the custom image on top of an already-
# published base image. Independent from build.yml (which builds the base
# and the gpuai custom image) so vast.ai rebuilds don't evict base/gpuai
# cache layers and vice versa.
#
# Trigger: manual dispatch only. You must first run build.yml to publish
# the base image, then run this workflow with the resulting base tag.
#
# Image: derekhsu/comfyui-gputw:vast-<base_tag>
#   - Always uses the same custom-nodes.txt as the gpuai variant.
#   - Adds the Civitai CLI for runtime model downloads.
#   - Reads secrets from /data/secrets/ (vast.ai volume mount path).

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Base image tag to build on (e.g. v0.30.0-cu128-pt2.6.0, dev, latest)"
        required: true
        default: "latest"
        type: string
      civitai_cli_version:
        description: "civitai/cli release tag (e.g. v0.1.81)"
        required: false
        default: "v0.1.81"
        type: string
      image_tag_suffix:
        description: "Override the vast- suffix (default: vast-<base_tag>)"
        required: false
        type: string

env:
  IMAGE_NAME: derekhsu/comfyui-gputw

jobs:
  build-vast:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute final tag
        id: tag
        run: |
          BASE_TAG="${{ inputs.base_tag }}"
          SUFFIX="${{ inputs.image_tag_suffix }}"
          if [ -n "$SUFFIX" ]; then
            FINAL_TAG="$SUFFIX"
          else
            FINAL_TAG="vast-${BASE_TAG}"
          fi
          echo "final_tag=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_NAME}:${FINAL_TAG} from base ${BASE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vast image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vast
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.final_tag }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}:${{ inputs.base_tag }}
            CIVITAI_CLI_VERSION=${{ inputs.civitai_cli_version }}
          # Separate cache scope from base + gpuai custom so vast rebuilds
          # do not evict their layers and vice versa.
          cache-from: type=gha,scope=${{ github.workflow }}-${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.workflow }}-${{ github.ref_name }},mode=min
          provenance: false

      - name: Tag vast-latest (when building from a versioned base)
        if: ${{ !inputs.image_tag_suffix && inputs.base_tag != 'dev' && inputs.base_tag != 'latest' }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:vast-latest" \
            "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.final_tag }}"
          echo "Also tagged vast-latest -> ${{ steps.tag.outputs.final_tag }}"
