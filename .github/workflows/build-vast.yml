name: build-vast

# Builds the vast.ai variant of the custom image on top of an already-
# published base image. Independent from build.yml (which builds the base
# and the gpuai custom image) so vast.ai rebuilds don't evict base/gpuai
# cache layers and vice versa.
#
# Trigger: manual dispatch only. You must first run build.yml to publish
# the base image, then run this workflow with the resulting base tag.
#
# Image: derekhsu/comfyui-gputw:vast-<base_tag>
#   - Always uses the same custom-nodes.txt as the gpuai variant.
#   - Adds the Civitai CLI for runtime model downloads.
#   - Reads secrets from /data/secrets/ (vast.ai volume mount path).
#   - Per-CUDA vast-latest alias (vast-latest-cu128, vast-latest-cu130, ...)
#     is created when base_tag is a versioned tag containing a cuXXX segment.

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Base image tag to build on (e.g. v0.37.0-cu128-pt2.11.0, dev, latest)"
        required: true
        default: "latest"
        type: string
      civitai_cli_version:
        description: "civitai/cli release tag (e.g. v0.1.81)"
        required: false
        default: "v0.1.81"
        type: string
      image_tag_suffix:
        description: "Override the vast- suffix (default: vast-<base_tag>)"
        required: false
        type: string

env:
  IMAGE_NAME: derekhsu/comfyui-gputw

jobs:
  build-vast:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute final tag
        id: tag
        run: |
          BASE_TAG="${{ inputs.base_tag }}"
          SUFFIX="${{ inputs.image_tag_suffix }}"
          if [ -n "$SUFFIX" ]; then
            FINAL_TAG="$SUFFIX"
          else
            FINAL_TAG="vast-${BASE_TAG}"
          fi
          # Extract CUDA tag from base_tag (e.g. v0.37.0-cu130-pt2.11.0 -> cu130)
          # for per-CUDA vast-latest alias. Falls back to empty for dev/latest.
          CUDA_TAG=$(echo "${BASE_TAG}" | grep -oE 'cu[0-9]+' | head -1 || true)
          echo "final_tag=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "cuda_tag=${CUDA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_NAME}:${FINAL_TAG} from base ${BASE_TAG} (cuda=${CUDA_TAG})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read base torch version
        id: torch
        run: |
          # The sage-builder stage compiles SageAttention against torch, so
          # install the exact torch already baked into BASE_IMAGE instead of
          # "latest" (they can differ if the base was built days earlier).
          # torch.__version__ looks like 2.9.1+cu130 — the +cuXXX suffix
          # also tells us which CUDA devel image the builder needs.
          BASE_TAG="${{ inputs.base_tag }}"
          TORCH_FULL=$(docker run --rm --platform linux/amd64 --entrypoint python3 \
            "${{ env.IMAGE_NAME }}:${BASE_TAG}" -c "import torch; print(torch.__version__)")
          TORCH_CUDA_TAG=$(echo "${TORCH_FULL}" | grep -oE 'cu[0-9]+' | head -1 || true)
          TORCH_CUDA_TAG="${TORCH_CUDA_TAG:-cu130}"
          case "$TORCH_CUDA_TAG" in
            cu128) DEVEL_IMAGE="nvidia/cuda:12.8.0-devel-ubuntu22.04" ;;
            cu129) DEVEL_IMAGE="nvidia/cuda:12.9.0-devel-ubuntu22.04" ;;
            cu130) DEVEL_IMAGE="nvidia/cuda:13.0.0-devel-ubuntu22.04" ;;
            *) echo "Unsupported torch CUDA tag: $TORCH_CUDA_TAG" >&2; exit 1 ;;
          esac
          echo "torch_version=${TORCH_FULL}" >> "$GITHUB_OUTPUT"
          echo "torch_cuda_tag=${TORCH_CUDA_TAG}" >> "$GITHUB_OUTPUT"
          echo "devel_image=${DEVEL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Base torch ${TORCH_FULL} (cuda=${TORCH_CUDA_TAG}, devel=${DEVEL_IMAGE})"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vast image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vast
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.final_tag }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}:${{ inputs.base_tag }}
            CIVITAI_CLI_VERSION=${{ inputs.civitai_cli_version }}
            TORCH_VERSION=${{ steps.torch.outputs.torch_version }}
            PYTORCH_CUDA_TAG=${{ steps.torch.outputs.torch_cuda_tag }}
            CUDA_DEVEL_IMAGE=${{ steps.torch.outputs.devel_image }}
          # Separate cache scope from base + gpuai custom so vast rebuilds
          # do not evict their layers and vice versa. Scope per CUDA variant
          # when extractable from base_tag so cu128/cu130/cu132 vast builds
          # don't evict each other.
          cache-from: type=gha,scope=${{ github.workflow }}-${{ github.ref_name }}-${{ steps.tag.outputs.cuda_tag }}
          cache-to: type=gha,scope=${{ github.workflow }}-${{ github.ref_name }}-${{ steps.tag.outputs.cuda_tag }},mode=min
          provenance: false

      - name: Tag vast-latest (when building from a versioned base)
        if: ${{ !inputs.image_tag_suffix && inputs.base_tag != 'dev' && inputs.base_tag != 'latest' && steps.tag.outputs.cuda_tag != '' }}
        run: |
          CUDA_TAG="${{ steps.tag.outputs.cuda_tag }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:vast-latest-${CUDA_TAG}" \
            "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.final_tag }}"
          echo "Also tagged vast-latest-${CUDA_TAG} -> ${{ steps.tag.outputs.final_tag }}"
